[package]
name = "moca-desktop"
version = "0.1.0"
description = "MOCA Desktop Client"
authors = []
edition = "2021"

[lib]
name = "moca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "moca-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
