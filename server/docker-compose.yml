
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: moca_postgres
    environment:
      POSTGRES_USER: moca
      POSTGRES_PASSWORD: mocapassword
      POSTGRES_DB: mocadb
    ports:
      - "5433:5432"
    volumes:
      - moca_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moca -d mocadb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: moca_redis
    ports:
      - "6380:6379"
    volumes:
      - moca_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  moca_postgres_data:
    driver: local
  moca_redis_data:
    driver: local
